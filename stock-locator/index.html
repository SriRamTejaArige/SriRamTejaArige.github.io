<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Locator</title>
<style>
:root{--bg:#f3f0e9;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e2ddd1;--acc:#e8590c;--acc2:#fff1e8;--warn:#b45309;--box:#fef3c7;--boxink:#92400e;--wall:#ebe6db}
@media (prefers-color-scheme:dark){:root{--bg:#151513;--card:#22211e;--ink:#f1efe9;--mute:#a19f97;--line:#38362f;--acc:#ff8a3d;--acc2:#3a2416;--warn:#fbbf24;--box:#3b2f12;--boxink:#fcd34d;--wall:#1d1c19}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{flex:none;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line);z-index:5}
.top{display:flex;gap:8px;align-items:center}
h1{font-size:17px;margin:0;white-space:nowrap}
.views{margin-left:auto;display:flex;gap:4px}
.search{position:relative;margin-top:8px}
.search input{width:100%;font-size:17px;padding:11px 14px 11px 38px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--acc)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:14px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}
/* result navigator */
.nav{display:none;margin-top:8px;background:var(--acc);color:#fff;border-radius:12px;padding:8px 10px;align-items:center;gap:8px}
.nav.show{display:flex}
.nav .txt{flex:1;min-width:0}
.nav .txt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .txt span{font-size:13px;opacity:.95}
.nav button{background:rgba(255,255,255,.2);border-color:transparent;color:#fff;padding:6px 12px;font-size:16px}
.nav .cnt{font-size:13px;white-space:nowrap}
/* store */
#store{flex:1;overflow:auto;background:var(--wall);position:relative;-webkit-overflow-scrolling:touch}
.floor{display:flex;flex-direction:column;gap:40px;padding:24px;width:max-content}
.wall{display:flex;gap:18px;align-items:flex-start}
.walltitle{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin-bottom:-28px}
.unit{position:relative;display:flex;flex-direction:column;border-radius:4px}
.uhead{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;align-items:baseline;gap:8px}
.uhead .tag{background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;font-size:16px}
.uhead small{font-weight:400;color:var(--mute);font-size:12px}
.frame{display:flex;flex-direction:column;padding:0 10px 10px;border-radius:3px}
/* metal rack */
.unit.metal .frame{background:linear-gradient(90deg,#9aa0a6 0 9px,transparent 9px calc(100% - 9px),#9aa0a6 calc(100% - 9px));background-color:#d9dcdf;padding:0 14px 8px}
@media (prefers-color-scheme:dark){.unit.metal .frame{background-color:#2b2e31;background-image:linear-gradient(90deg,#5f666d 0 9px,transparent 9px calc(100% - 9px),#5f666d calc(100% - 9px))}}
.unit.metal .plank{background:#a7adb3;height:7px}
/* white wooden */
.unit.white .frame{background:#fbfaf7;border:8px solid #fff;border-top-width:6px;box-shadow:0 0 0 1px #d7d2c6}
@media (prefers-color-scheme:dark){.unit.white .frame{background:#2a2925;border-color:#3a3833;box-shadow:0 0 0 1px #4a473f}}
.unit.white .plank{background:#fff;height:8px;box-shadow:0 1px 0 #d7d2c6}
@media (prefers-color-scheme:dark){.unit.white .plank{background:#3a3833;box-shadow:none}}
/* wood cabinet */
.unit.wood .frame{background:#efe7dc;border:8px solid #b98a5a;padding:0}
@media (prefers-color-scheme:dark){.unit.wood .frame{background:#2a241d;border-color:#7a5a3a}}
.drawers{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#c99a69;padding:6px}
.drawer{background:#d9ae7f;height:46px;border-radius:2px;position:relative}
.drawer:after{content:"";position:absolute;left:30%;right:30%;top:20px;height:5px;border-radius:3px;background:#bfc3c7}
@media (prefers-color-scheme:dark){.drawers{background:#6b4f33}.drawer{background:#86643f}}
.dcols{display:grid;grid-template-columns:repeat(3,minmax(280px,auto));gap:0}
.dcol{border-right:8px solid #b98a5a;display:flex;flex-direction:column}
.dcol:last-child{border-right:0}
@media (prefers-color-scheme:dark){.dcol{border-color:#7a5a3a}}
.unit.wood .plank{background:#fff;height:7px}
@media (prefers-color-scheme:dark){.unit.wood .plank{background:#3a3833}}
.colhead{font-size:12px;font-weight:700;text-align:center;padding:4px;background:#c99a69;color:#3b2a18}
.level{position:relative;padding:22px 4px 0;min-height:70px}
.lvl{position:absolute;left:4px;top:3px;font-size:11px;font-weight:800;color:var(--mute);letter-spacing:.3px}
.level.hitlvl .lvl{color:var(--acc)}
.level.hitlvl{background:rgba(232,89,12,.08)}
.rowlbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:2px 0 1px}
.boxes{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end}
.row.back .boxes,.row.mid .boxes{opacity:.78}
.row.back{padding:0 10px;filter:saturate(.75)}
.row.mid{padding:0 5px}
.row.front{padding-top:4px}
.empty-lvl{font-size:11px;color:var(--mute);font-style:italic;padding:12px 4px}
/* boxes */
.bx{position:relative;width:96px;min-height:58px;padding:9px 5px 6px;border-radius:3px;font-size:10.5px;line-height:1.15;cursor:pointer;color:#2b2117;text-align:center;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.18);transition:transform .15s,opacity .2s,box-shadow .2s;display:flex;flex-direction:column;justify-content:center}
.bx:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:rgba(0,0,0,.13);border-radius:3px 3px 0 0}
.bx .lb{background:rgba(255,255,255,.82);border-radius:2px;padding:2px 3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.bx .qt{font-size:9.5px;margin-top:2px;opacity:.85}
.bx .fn{position:absolute;right:2px;bottom:2px;font-size:8.5px;font-weight:800;padding:0 3px;border-radius:2px;background:rgba(255,255,255,.85)}
.bx .dg{position:absolute;left:2px;bottom:1px;font-size:10px}
.row.back .bx{width:84px;min-height:46px;font-size:9.5px}
.bx:hover{transform:translateY(-2px)}
.dimmed .bx{opacity:.18}
.dimmed .bx.hit{opacity:1}
.bx.hit{box-shadow:0 0 0 3px var(--acc),0 2px 8px rgba(0,0,0,.25)}
.bx.focus{z-index:3;transform:scale(1.18);animation:pulse 1.2s ease-in-out infinite}
.bx.focus:after{content:"📍";position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:20px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--acc),0 0 0 8px rgba(232,89,12,.25)}50%{box-shadow:0 0 0 4px var(--acc),0 0 0 14px rgba(232,89,12,.05)}}
/* list */
#list{flex:1;overflow:auto;display:none;padding:12px 14px 90px}
#list .wrap{max-width:860px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.loc{flex:none;min-width:74px;text-align:center;background:var(--acc2);color:var(--acc);border-radius:10px;padding:6px;font-weight:700;font-size:16px;line-height:1.15}
.loc span{display:block;font-size:10px;font-weight:700}
.name{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute)}
.note{color:var(--mute);font-size:13px;margin-top:3px}
.disg{margin-top:5px;background:var(--box);color:var(--boxink);border-radius:6px;padding:3px 8px;font-size:13px;display:inline-block}
.vars{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.vars span{font-size:12px;background:var(--bg);border-radius:5px;padding:1px 6px}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.veil.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.veil{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 6px;font-size:19px}
.where{background:var(--acc2);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.where b{color:var(--acc)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
input.f,select.f{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btns .del{margin-right:auto;color:#dc2626;border-color:#dc2626}
.photo img{width:100%;border-radius:10px;margin-top:8px}
.fab{position:fixed;right:14px;bottom:14px;z-index:6;padding:11px 16px;font-weight:600;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:30;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:3px;vertical-align:-1px}
textarea{width:100%;height:220px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
.status{font-size:12px;color:var(--mute);margin-top:6px}
.tools{position:fixed;left:14px;bottom:14px;z-index:6;display:flex;gap:3px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tools button{border:0;min-width:36px;height:36px;padding:0 10px;font-weight:700}
.tools .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.bx{background-image:linear-gradient(180deg,rgba(255,255,255,.25),rgba(0,0,0,.06))}
@media(max-width:600px){#legend{display:none!important}}
#addBtn,#sEdit{display:none!important}
</style>
</head>

<header>
  <div class="top"><h1>📦 Stock Locator</h1>
    <div class="views"><button data-view="store" class="on">Shelves</button><button data-view="list">List</button></div></div>

</header>
<div id="store"><div class="floor" id="floor"></div></div>
<div id="list"><div class="wrap" id="listOut"></div><div class="btns"><button id="csvBtn">Copy whole list (for Excel)</button></div></div>
<div class="tools" id="tools"><button data-jump="C" title="Go to grey rack">C</button><button data-jump="A" title="Go to white unit">A</button><button data-jump="B" title="Go to big white unit">B</button><button data-jump="D" title="Go to cabinet">D</button><span class="sep"></span><button id="zo" title="Zoom out">−</button><button id="zfit" title="Fit to screen">⤢</button><button id="zi" title="Zoom in">+</button></div>
<button class="fab pri" id="addBtn">+ Add</button>
<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

const SUBNAME=s=>s[0]==="D"?s.slice(0,2)+(s[2]==="T"?" Top":" Bottom"):s;
const POS={"":"Front","back":"Back","mid":"Middle"};
const FIN={SS:"Stainless Steel",AQ:"Antique",PC:"Powder Coated",Iron:"Iron",Brass:"Brass",CP:"Chrome Plated",GM:"Gun Metal"};
const TYPES=[["t-hinge|t hinge|thinge","T-Hinge"],["l-t-bolt|l t-bolt|l-tbolt","L T-Bolt"],["t-bolt|tbolt|t bolt","T-Bolt"],["aldrop","Aldrop"],["latch","Latch"],["gate hook","Gate Hook"],["s hook|j hook","Hook"],["stopper","Door Stopper"],["door closer|window closer","Door Closer"],["hydraulic","Hydraulic"],["handle","Handle"],["hinge","Hinge"],["screw|patta|bolt / nut|rivet|nails","Screws & Fasteners"],["towel","Towel Ring / Rod"],["bracket","Bracket"],["kit","Door Kit"],["wheel|roller|track|sliding","Wheels / Rollers / Sliding"],["lock","Lock"],["kada","Kada"],["basket","Kitchen Basket"],["bits|cutter|bosch|drill","Tools & Bits"],["bed joint","Bed Fitting"]];
// box colours by type (generic coloured cartons)
const TCOL={"Handle":"#f4a261","T-Bolt":"#8ecae6","L T-Bolt":"#a8dadc","Aldrop":"#e9c46a","Latch":"#f6d186","Hinge":"#b5e48c","T-Hinge":"#95d5b2","Screws & Fasteners":"#cdb4db","Bracket":"#ffafcc","Door Kit":"#e76f51","Towel Ring / Rod":"#90e0ef","Wheels / Rollers / Sliding":"#bde0fe","Lock":"#adb5bd","Gate Hook":"#d4a373","Door Stopper":"#ccd5ae","Kada":"#e0aaff","Tools & Bits":"#ff8fab","Hydraulic":"#9bf6ff","Door Closer":"#a3b18a","Kitchen Basket":"#ffd6a5","Bed Fitting":"#c9ada7","Hook":"#d6ccc2"};
const colOf=t=>TCOL[t]||"#e3d5ca";
const subOf=id=>id.split("-")[0], posOf=id=>id.split("-")[1]||"", unitOf=id=>id[0];
const ORDER=[];for(const u of ["A","B","C","D"])for(const s of UNITS[u].subs)for(const p of ["","mid","back"])ORDER.push(s+(p?"-"+p:""));

function norm(it){
  const o={...it};const n=o.n||"",x=o.x||"";
  if(o.f===undefined){const m=n.match(/\b(SS|AQ|PC)\b/);o.f=m?m[1]:(/\bIron\b/i.test(n)?"Iron":/\bBrass\b/i.test(n)?"Brass":"")}
  if(!o.t){const l=(n+" ").toLowerCase();o.t="Other";for(const[k,v]of TYPES){if(k.split("|").some(w=>l.includes(w))){o.t=v;break}}}
  let rest=x;
  if(o.d===undefined){o.d="";if(/box/i.test(x)&&!/\d+\s*(set|pcs?|pieces)/i.test(x)){o.d=x.replace(/^in\s+/i,"");rest=""}}
  if(o.v===undefined){o.v=[];if((rest.match(/,/g)||[]).length>=2){o.v=rest.split(",").map(s=>s.trim()).filter(Boolean);rest=""}}
  else if(typeof o.v==="string")o.v=o.v.split(",").map(s=>s.trim()).filter(Boolean);
  o.note=o.note!==undefined?o.note:rest;return o}

let spots={},coll=null,view="store",matches=[],cur=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const compact=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2200)}
function items(id){return (spots[id]?.items||[]).map((it,i)=>({id,i,...norm(it)}))}
function rows(){return ORDER.flatMap(items).concat(Object.keys(spots).filter(k=>!ORDER.includes(k)).flatMap(items))}
function hay(r){return compact([r.n,r.t,r.f,FIN[r.f]||"",r.d,(r.v||[]).join(" "),r.note,SUBNAME(subOf(r.id)),r.q].join(" "))}
function whereText(r){const u=UNITS[unitOf(r.id)],p=posOf(r.id);
  return `<b>${esc(SUBNAME(subOf(r.id)))}</b> · ${esc(u.name)} · <b>${POS[p]} row</b>${p==="back"?" — behind the front boxes":p==="mid"?" — between front & back":""}`}

/* ---------- store drawing ---------- */
function boxHTML(r){return `<div class="bx" id="bx-${r.id}-${r.i}" data-k="${r.id}|${r.i}" style="background:${colOf(r.t)}" title="${esc(r.n)}">
  <div class="lb">${esc(r.n)}</div>${r.q?`<div class="qt">${esc(r.q)}</div>`:""}${r.f?`<span class="fn">${esc(r.f)}</span>`:""}${r.d?`<span class="dg" title="kept in a different box">📦</span>`:""}</div>`}
function levelHTML(sub,label){
  const back=items(sub+"-back"),mid=items(sub+"-mid"),front=items(sub);
  const row=(arr,cls,lbl)=>arr.length?`<div class="row ${cls}">${lbl?`<div class="rowlbl">${lbl}</div>`:""}<div class="boxes">${arr.map(boxHTML).join("")}</div></div>`:"";
  const has=back.length||mid.length;
  return `<div class="level" data-sub="${sub}"><span class="lvl">${esc(label||sub)}</span>
   ${row(back,"back","back row")}${row(mid,"mid","middle")}${row(front,"front",has?"front":"")}
   ${!back.length&&!mid.length&&!front.length?`<div class="empty-lvl">empty</div>`:""}</div><div class="plank"></div>`}
function unitHTML(u){const U=UNITS[u];
  if(u==="D"){return `<div class="unit wood" id="unit-D"><div class="uhead"><span class="tag">D</span>${U.name}<small>D1 left · D2 middle · D3 right</small></div>
   <div class="frame"><div class="drawers">${"<div class='drawer'></div>".repeat(4)}</div><div class="dcols">
   ${["D1","D2","D3"].map(c=>`<div class="dcol"><div class="colhead">${c}</div>${levelHTML(c+"T",c+" Top")}${levelHTML(c+"B",c+" Bottom")}</div>`).join("")}</div></div></div>`}
  return `<div class="unit ${U.cls}" id="unit-${u}" style="width:${U.w}px"><div class="uhead"><span class="tag">${u}</span>${U.name}</div>
   <div class="frame">${U.subs.map(s=>levelHTML(s,U.lv[s]||s)).join("")}</div></div>`}
function drawStore(){
  $("#floor").innerHTML=`<div class="walltitle">Back wall</div><div class="wall">${unitHTML("C")}${unitHTML("A")}${unitHTML("B")}</div>
   <div class="walltitle">Drawer cabinet</div><div class="wall">${unitHTML("D")}</div>`;
  const used=[...new Set(rows().map(r=>r.t))];
  $("#legend").innerHTML=used.sort().map(t=>`<span><i style="background:${colOf(t)}"></i>${esc(t)}</span>`).join("")+`<span>📦 = kept in a different box</span>`;
}

/* ---------- search ---------- */
function runSearch(jump=true){
  const q=$("#q").value.trim();const toks=q.toLowerCase().split(/\s+/).map(compact).filter(Boolean);
  document.querySelectorAll(".bx.hit,.bx.focus").forEach(e=>e.classList.remove("hit","focus"));
  document.querySelectorAll(".level.hitlvl").forEach(e=>e.classList.remove("hitlvl"));
  const tm=(h,t)=>h.includes(t)||(/^\d+(x\d+)+$/.test(t)&&t.split("x").every(p=>h.includes(p)));
  matches=toks.length?rows().filter(r=>{const h=hay(r);return toks.every(t=>tm(h,t))}):[];
  $("#floor").classList.toggle("dimmed",toks.length>0);
  matches.forEach(r=>{const el=document.getElementById(`bx-${r.id}-${r.i}`);if(el){el.classList.add("hit");el.closest(".level")?.classList.add("hitlvl")}});
  cur=0;
  if(!toks.length){$("#nav").classList.remove("show");renderList();return}
  $("#nav").classList.add("show");
  if(!matches.length){$("#navtxt").innerHTML=`<b>No match</b><span>Try fewer words — just the brand or the size</span>`;$("#cnt").textContent="";renderList();return}
  renderList();if(jump)focusMatch();
}
function focusMatch(){
  const r=matches[cur];if(!r)return;
  document.querySelectorAll(".bx.focus").forEach(e=>e.classList.remove("focus"));
  $("#navtxt").innerHTML=`<b>${esc(r.n)}${r.q?" · "+esc(r.q):""}</b><span>${SUBNAME(subOf(r.id))} · ${UNITS[unitOf(r.id)].name} · ${POS[posOf(r.id)]} row${r.d?" · 📦 in "+esc(r.d):""}</span>`;
  $("#cnt").textContent=`${cur+1}/${matches.length}`;
  if(view==="store"){if(Z<.6)setZoom(.85);const el=document.getElementById(`bx-${r.id}-${r.i}`);if(el){el.classList.add("focus");el.scrollIntoView({behavior:"smooth",block:"center",inline:"center"})}}
}
$("#next").onclick=()=>{if(matches.length){cur=(cur+1)%matches.length;focusMatch()}};
$("#prev").onclick=()=>{if(matches.length){cur=(cur-1+matches.length)%matches.length;focusMatch()}};
$("#navtxt").onclick=()=>{const r=matches[cur];if(r)showItem(r.id,r.i)};
let st;$("#q").addEventListener("input",()=>{clearTimeout(st);st=setTimeout(runSearch,250)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#q").blur();if(matches.length)focusMatch()}});

/* ---------- list view ---------- */
function renderList(){
  const q=$("#q").value.trim();const W=q.split(/\s+/).filter(w=>w.length>1);
  const hl=t=>{let s=esc(t);for(const w of W)s=s.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");return s};
  const list=q?matches:rows();
  $("#listOut").innerHTML=list.length?list.map(r=>`<div class="card" data-k="${r.id}|${r.i}"><div class="loc">${esc(SUBNAME(subOf(r.id)))}<span>${POS[posOf(r.id)].toUpperCase()}</span></div>
   <div><div class="name">${hl(r.n)}</div><div class="chips"><span class="chip">${esc(r.t)}</span>${r.f?`<span class="chip">${esc(r.f)}${FIN[r.f]&&FIN[r.f]!==r.f?" · "+FIN[r.f]:""}</span>`:""}${r.q?`<span class="chip">${esc(r.q)}</span>`:""}</div>
   ${r.d?`<div class="disg">📦 Kept in: <b>${hl(r.d)}</b></div>`:""}${r.v?.length?`<div class="vars">${r.v.map(v=>`<span>${hl(v)}</span>`).join("")}</div>`:""}${r.note?`<div class="note">${hl(r.note)}</div>`:""}</div></div>`).join(""):`<div class="note" style="text-align:center;padding:30px">Nothing found.</div>`;
}
document.querySelector(".views").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.view;
  document.querySelectorAll(".views button").forEach(x=>x.classList.toggle("on",x===b));
  $("#store").style.display=view==="store"?"":"none";$("#list").style.display=view==="list"?"block":"none";$("#legend").style.display=view==="store"?"":"none";$("#tools").style.display=view==="store"?"":"none";
  if(view==="store"&&matches.length)setTimeout(focusMatch,50)});

/* ---------- item sheet / edit ---------- */
function closeSheet(){$("#veil").classList.remove("show")}
$("#veil").addEventListener("click",e=>{if(e.target.id==="veil")closeSheet()});
function showItem(id,i){const r=items(id)[i];if(!r)return;
  $("#sheet").innerHTML=`<h3>${esc(r.n)}</h3>
  <div class="chips"><span class="chip">${esc(r.t)}</span>${r.f?`<span class="chip">${esc(r.f)} · ${esc(FIN[r.f]||r.f)}</span>`:""}${r.q?`<span class="chip">${esc(r.q)}</span>`:""}</div>
  <div class="where">📍 ${whereText(r)}</div>
  ${r.d?`<div class="disg">📦 Not in its own box — look for the <b>${esc(r.d)}</b></div>`:""}
  ${r.v?.length?`<label>Inside this box</label><div class="vars">${r.v.map(v=>`<span>${esc(v)}</span>`).join("")}</div>`:""}
  ${r.note?`<div class="note">${esc(r.note)}</div>`:""}
  <div class="photo"><img src="${UNITS[unitOf(id)].img}" alt="photo of ${esc(UNITS[unitOf(id)].name)}"></div>
  <div class="btns"><button id="sClose">Close</button><button class="pri" id="sEdit">Edit / Move</button></div>`;
  $("#veil").classList.add("show");$("#sClose").onclick=closeSheet;$("#sEdit").onclick=()=>{if(!coll){toast("Sign in to edit");return}editForm(id,i)}}

function editForm(id,i){
  const isNew=i==null;const it=isNew?{n:"",t:"",f:"",q:"",d:"",v:[],note:""}:items(id)[i];
  const cu=id?unitOf(id):"C",cs=id?subOf(id):"C1",cp=id?posOf(id):"";
  const typeList=[...new Set(TYPES.map(t=>t[1]).concat(rows().map(r=>r.t)))].sort();
  $("#sheet").innerHTML=`<h3>${isNew?"Add item":"Edit / move item"}</h3>
  <div class="three"><div><label>Shelf</label><select class="f" id="fu">${["A","B","C","D"].map(u=>`<option ${u===cu?"selected":""}>${u}</option>`).join("")}</select></div>
  <div><label>Sub-shelf</label><select class="f" id="fs"></select></div>
  <div><label>Front / Back</label><select class="f" id="fp">${Object.entries(POS).map(([k,v])=>`<option value="${k}" ${k===cp?"selected":""}>${v}</option>`).join("")}</select></div></div>
  <label>Product name</label><input class="f" id="fn" value="${esc(it.n)}">
  <div class="two"><div><label>Type</label><input class="f" id="ft" list="tl" value="${esc(it.t)}"><datalist id="tl">${typeList.map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>
  <div><label>Finish</label><select class="f" id="ff"><option value="">—</option>${Object.entries(FIN).map(([k,v])=>`<option value="${k}" ${k===it.f?"selected":""}>${k===v?k:k+" – "+v}</option>`).join("")}</select></div></div>
  <div class="two"><div><label>Quantity</label><input class="f" id="fq" value="${esc(it.q)}"></div>
  <div><label>Disguise (kept in which other box?)</label><input class="f" id="fd" value="${esc(it.d)}"></div></div>
  <label>Variants inside (comma separated)</label><input class="f" id="fv" value="${esc((it.v||[]).join(", "))}">
  <label>Note</label><input class="f" id="fx" value="${esc(it.note)}">
  ${!isNew&&it.u?`<label><input type="checkbox" id="fok"> Checked — remove ⚠</label>`:""}
  <div class="btns">${isNew?"":`<button class="del" id="fdel">Delete</button>`}<button id="fc">Cancel</button><button class="pri" id="fsv">Save</button></div>`;
  const fill=()=>{$("#fs").innerHTML=UNITS[$("#fu").value].subs.map(k=>`<option value="${k}" ${k===cs?"selected":""}>${SUBNAME(k)}</option>`).join("")};
  fill();$("#fu").onchange=fill;$("#veil").classList.add("show");$("#fc").onclick=closeSheet;
  if(!isNew)$("#fdel").onclick=async()=>{const b=$("#fdel");if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Tap again to delete";return}
    const a=[...spots[id].items];a.splice(i,1);try{await save(id,a);closeSheet();toast("Deleted")}catch(e){toast("Could not delete")}};
  $("#fsv").onclick=async()=>{const n=$("#fn").value.trim();if(!n){$("#fn").focus();return}
    const rec={n,t:$("#ft").value.trim()||"Other",f:$("#ff").value,q:$("#fq").value.trim(),d:$("#fd").value.trim(),v:$("#fv").value.split(",").map(s=>s.trim()).filter(Boolean),note:$("#fx").value.trim()};
    if(!isNew&&it.u&&!$("#fok")?.checked)rec.u=true;
    const to=$("#fs").value+($("#fp").value?"-"+$("#fp").value:"");
    try{if(isNew)await save(to,[...(spots[to]?.items||[]),rec]);
      else if(to===id){const a=[...spots[id].items];a[i]=rec;await save(id,a)}
      else{const a=[...spots[id].items];a.splice(i,1);await save(id,a);await save(to,[...(spots[to]?.items||[]),rec])}
      closeSheet();toast("Saved ✓")}catch(e){toast("Could not save: "+(e.message||e))}}}
async function save(id,arr){if(!coll)throw new Error("not connected");spots[id]={items:arr};refresh(false);await coll.doc(id).set({items:arr})}

document.addEventListener("click",e=>{const k=e.target.closest("[data-k]");if(!k||k.closest(".sheet"))return;const[id,i]=k.dataset.k.split("|");
  const idx=matches.findIndex(m=>m.id===id&&m.i===+i);if(idx>=0){cur=idx;focusMatch()}showItem(id,+i)});
$("#addBtn").onclick=()=>{if(!coll){toast("Sign in to edit");return}editForm(null,null)};
$("#csvBtn").onclick=()=>{const c=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const txt=["Shelf,Sub-shelf,Front/Back,Product,Type,Finish,Quantity,Disguise (other box),Variants,Note"].concat(rows().map(r=>[unitOf(r.id),SUBNAME(subOf(r.id)),POS[posOf(r.id)],r.n,r.t,r.f,r.q,r.d,(r.v||[]).join("; "),r.note].map(c).join(","))).join("\n");
  $("#sheet").innerHTML=`<h3>Whole list</h3><textarea id="ta" readonly>${esc(txt)}</textarea><div class="btns"><button id="cc">Close</button><button class="pri" id="cp">Copy</button></div>`;
  $("#veil").classList.add("show");$("#cc").onclick=closeSheet;$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast("Copied ✓")}catch{$("#ta").select();toast("Select all & copy")}}};


/* ---------- zoom & jump ---------- */
let Z=1;
function setZoom(v){Z=Math.max(.3,Math.min(1.6,v));$("#floor").style.zoom=Z;try{localStorage.setItem("sl-zoom",Z)}catch(e){}}
$("#zi").onclick=()=>setZoom(Z+.15);
$("#zo").onclick=()=>setZoom(Z-.15);
$("#zfit").onclick=()=>{const f=$("#floor");f.style.zoom=1;const w=f.scrollWidth;setZoom(($("#store").clientWidth-8)/w);$("#store").scrollTo({left:0,top:0,behavior:"smooth"})};
document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{if(view!=="store")return;document.getElementById("unit-"+b.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start",inline:"start"})});
(()=>{let s=null;try{s=parseFloat(localStorage.getItem("sl-zoom"))}catch(e){}setZoom(s||(window.innerWidth<700?.8:1))})();
function refresh(jump){drawStore();runSearch(jump)}
spots=DATA;$("#status").textContent=`${rows().length} items · tap any box for details · search jumps to the box`;refresh(true);
</script>
</body>
</html>
